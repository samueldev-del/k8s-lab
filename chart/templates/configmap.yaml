apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mywebapp.fullname" . }}-config
  labels:
    {{- include "mywebapp.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head><meta charset="utf-8"><title>{{ .Release.Name }}</title></head>
    <body>
      <h1>{{ .Values.pageMessage }}</h1>
      <p>Release: {{ .Release.Name }} — chart {{ .Chart.Name }} v{{ .Chart.Version }}</p>
      <p>Replicas requested: {{ .Values.replicaCount }}</p>
    </body>
    </html>
