alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

serverFiles:
  alerting_rules.yml:
    groups:
      - name: lab-alerts
        rules:
          - alert: TargetDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Scrape target {{ $labels.instance }} is down"
              description: "Job {{ $labels.job }} has been unreachable for over a minute."

          - alert: PodNotRunning
            expr: kube_pod_status_phase{phase!="Running"} == 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} is in phase {{ $labels.phase }}"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has not been Running for 2 minutes."

          - alert: HighMemoryUsage
            expr: sum by (pod, namespace) (container_memory_working_set_bytes{container!=""}) / 1024 / 1024 > 200
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} uses over 200 MiB"
              description: "Memory usage has exceeded 200 MiB for 5 minutes."
